apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: flask-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
      - name: flask-app
        image: 044260498233.dkr.ecr.us-east-1.amazonaws.com/a1:5be7dedf48531e155cb0fee4c3c7eeee110d3fbe
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-app
  namespace: flask-app
spec:
  selector:
    app: flask-app

  ports:
  - port: 80
    targetPort: 5000

  type: LoadBalancer        